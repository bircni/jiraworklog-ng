# Ignore package versions published less than 3 days ago (supply-chain safety)
minimumReleaseAge: 4320

# Native/postinstall dependencies allowed to run build scripts.
# pnpm 11 honors the `allowBuilds` map; `onlyBuiltDependencies` is kept for compatibility.
allowBuilds:
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - electron-winstaller
  - esbuild
  - sharp
  - unrs-resolver
